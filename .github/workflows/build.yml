name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: pyinstaller build.spec

      - name: Generate self-signed certificate
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=肖润之" `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA -KeyLength 2048 `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(10)
          $pwd = ConvertTo-SecureString -String "temp123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pwd
          Export-Certificate -Cert $cert -FilePath cert.cer
        shell: powershell

      - name: Sign EXE
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          $exe = Get-ChildItem "dist" -Filter "*.exe" | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p temp123 /fd SHA256 /d "Temperature Monitoring Tool" $exe.FullName
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: temperature-tool-windows
          path: |
            dist/
            cert.cer

      - name: Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            cert.cer
          name: 最新版本
          tag_name: latest
          body: |
            ## 温度监控数据分析工具

            下载下方文件即可使用：

            - **温度监控数据分析工具.exe** — 主程序（已签名，发布者：肖润之）
            - **cert.cer** — 证书文件（可选，用于消除 Windows 安全警告）

            ### 首次使用

            1. 下载 exe 文件
            2. 若 Windows 提示安全警告，点击「更多信息」→「仍要运行」
            3. 如需消除警告，双击 cert.cer → 安装证书 → 本地计算机 → 受信任的根证书颁发机构
          prerelease: false
          make_latest: true

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            cert.cer
          name: ${{ github.ref_name }}
          body: |
            ## 温度监控数据分析工具 ${{ github.ref_name }}

            下载下方文件即可使用：

            - **温度监控数据分析工具.exe** — 主程序（已签名，发布者：肖润之）
            - **cert.cer** — 证书文件（可选，用于消除 Windows 安全警告）

            ### 首次使用

            1. 下载 exe 文件
            2. 若 Windows 提示安全警告，点击「更多信息」→「仍要运行」
            3. 如需消除警告，双击 cert.cer → 安装证书 → 本地计算机 → 受信任的根证书颁发机构
          prerelease: false
          make_latest: true
